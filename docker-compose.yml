name: nucestatic-terminal-api

services:
  db:
    image: mysql:8.0
    container_name: nucestatic-terminal-api-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --innodb-log-buffer-size=64M
      - --max-connections=100
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nucestatic_terminal}
      MYSQL_USER: ${MYSQL_USER:-nucestatic}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      TZ: Asia/Jakarta
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend

  app:
    build: .
    container_name: nucestatic-terminal-api-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
    ports:
      - "127.0.0.1:8311:8311"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  worker:
    build: ./worker
    container_name: nucestatic-terminal-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      API_BASE_URL: http://app:8311
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - backend

volumes:
  db_data:

networks:
  backend:
